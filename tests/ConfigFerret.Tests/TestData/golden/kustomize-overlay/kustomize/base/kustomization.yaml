apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
configMapGenerator:
  - name: billing-config
    literals:
      - BILLING_Billing__Currency=EUR
      - BILLING_Smtp__Host=smtp.internal
      - BILLING_Smtp__Port=25
    envs:
      - billing.properties
secretGenerator:
  - name: billing-secrets
    literals:
      - BILLING_Stripe__ApiKey=sk_live_base_placeholder
