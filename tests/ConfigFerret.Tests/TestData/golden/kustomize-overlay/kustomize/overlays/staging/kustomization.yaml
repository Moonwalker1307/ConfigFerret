apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: staging-
resources:
  - ../../base
configMapGenerator:
  - name: billing-config
    behavior: merge
    literals:
      - BILLING_Smtp__Host=smtp.staging.internal
    envs:
      - staging.properties
secretGenerator:
  - name: billing-secrets
    behavior: replace
    literals:
      - BILLING_Stripe__ApiKey="sk_test_staging"
