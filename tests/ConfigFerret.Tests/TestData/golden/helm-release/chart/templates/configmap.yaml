apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
data:
  Db__Port: {{ .Values.db.port | quote }}
  Db__Timeout: {{ .Values.db.timeout | quote }}
  Cache__Ttl: {{ .Values.cache.ttl | quote }}
  Logging__LogLevel__Default: {{ .Values.logging.level | quote }}
  Features__Search: {{ .Values.features.search | quote }}
