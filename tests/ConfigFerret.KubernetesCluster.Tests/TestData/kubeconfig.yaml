# A kubeconfig for tests: the server name never resolves, the fake handler answers every request.
apiVersion: v1
kind: Config
current-context: prod
clusters:
  - name: prod-cluster
    cluster:
      server: https://fake-cluster.example:6443
  - name: plain
    cluster:
      server: http://plain-cluster.example:8080
  - name: local
    cluster:
      server: http://127.0.0.1:8001
  - name: ftp
    cluster:
      server: ftp://ftp-cluster.example
contexts:
  - name: prod
    context:
      cluster: prod-cluster
      user: prod-user
      namespace: orders
  - name: no-namespace
    context:
      cluster: prod-cluster
      user: prod-user
  - name: plain
    context:
      cluster: plain
      user: prod-user
  - name: local
    context:
      cluster: local
      user: prod-user
  - name: ftp
    context:
      cluster: ftp
      user: prod-user
users:
  - name: prod-user
    user:
      token: kubeconfig-token-5c1d
