name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests build on Linux only. Pushes to main (merges), tags and manual runs build on all three.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - run: dotnet --info

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  pack:
    name: Pack NuGet packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Pick the package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Every package gets the same version, so ConfigFerret.GitHub and ConfigFerret.Octopus depend on the matching
      # ConfigFerret, and the ConfigFerret.Tool command bundles the same libraries.
      - name: Pack
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for project in ConfigFerret ConfigFerret.GitHub ConfigFerret.Octopus ConfigFerret.Tool; do
            dotnet pack "src/$project" -c Release -o artifacts -p:Version="$VERSION"
          done

      - name: Check each package holds both target frameworks
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for id in ConfigFerret ConfigFerret.GitHub ConfigFerret.Octopus; do
            pkg="artifacts/$id.$VERSION.nupkg"
            unzip -l "$pkg" > contents.txt
            cat contents.txt
            grep -q "lib/net10.0/$id.dll" contents.txt
            grep -q "lib/net11.0/$id.dll" contents.txt
          done
          # The extension packages must depend on the core package of the same version.
          for id in ConfigFerret.GitHub ConfigFerret.Octopus; do
            unzip -p "artifacts/$id.$VERSION.nupkg" "$id.nuspec" | grep -q "id=\"ConfigFerret\" version=\"$VERSION\""
          done
          # The tool package carries the command and the libraries it traces with, for both target frameworks.
          pkg="artifacts/ConfigFerret.Tool.$VERSION.nupkg"
          unzip -l "$pkg" > contents.txt
          cat contents.txt
          unzip -p "$pkg" ConfigFerret.Tool.nuspec | grep -q '<packageType name="DotnetTool"'
          for tfm in net10.0 net11.0; do
            for dll in ConfigFerret.Tool ConfigFerret ConfigFerret.GitHub ConfigFerret.Octopus; do
              grep -q "tools/$tfm/any/$dll.dll" contents.txt
            done
          done

      - name: Install and run the tool from the package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet tool install --tool-path tools --add-source artifacts ConfigFerret.Tool --version "$VERSION"
          tools/configferret --version
          dir=tests/ConfigFerret.Tests/TestData/golden/container
          tools/configferret container -m "$dir/cluster.yaml" -w api-7d9f8c-x2kqp -c api --chart "$dir/helm" -f "$dir/helm/release-values.yaml" DB__Timeout

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: artifacts/*

  publish:
    name: Publish to NuGet
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Protection rules on this environment (Settings > Environments) can require an approval or limit which tags may publish.
    environment: nuget
    permissions:
      contents: read
      id-token: write # Trusted publishing: exchange the GitHub OIDC token for a short-lived NuGet API key.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org account that owns the trusted publishing policy. Override with the NUGET_USER repository variable.
          user: ${{ vars.NUGET_USER || 'Moonwalker1307' }}

      - name: Push
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
