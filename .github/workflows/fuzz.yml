name: Fuzz

# Fuzzes the parsers every night with SharpFuzz and libFuzzer. See fuzz/README.md.
on:
  schedule:
    - cron: '23 2 * * *' # 02:23 UTC every night
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: '1200'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CXX: clang++-18

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [json, helm-values, helm-set, helm-template, kubernetes, container, kustomize, env-names, github, octopus, vault, consul, kubernetes-cluster, azure-keyvault, azure-appconfig, aws-secrets, aws-parameters, desktop-tar, dotenv, secret-audit, scanner, workspace, code-reads, helm-usage, gcp-secrets, azure-devops, gitlab, gitops, terraform, dotenv-layers, compose, unused]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install clang with the libFuzzer runtime
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev

      # The corpus each night's run grows is kept in the cache and fed to the next night's run.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/work/${{ matrix.target }}/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_TO_FUZZ: ${{ inputs.seconds || '1200' }}
        run: |
          # The input reaches the script as data, never as code, and must be a whole number.
          if ! [[ "$SECONDS_TO_FUZZ" =~ ^[0-9]+$ ]]; then
            echo "::error::seconds must be a whole number, got '$SECONDS_TO_FUZZ'."
            exit 1
          fi
          fuzz/run.sh "$TARGET" "$SECONDS_TO_FUZZ"

      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/work/${{ matrix.target }}/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # Upload before the replay, so the input is kept whatever the replay does, and also when the job is cancelled.
      - name: Upload the findings
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: fuzz/findings/${{ matrix.target }}
          if-no-files-found: ignore

      # The replay has no time limit of its own, so an input that hangs (timeout-<hash>) is stopped after two minutes.
      # The Fuzz step has already failed the job.
      - name: Replay the findings for a readable stack trace
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          dotnet build fuzz/ConfigFerret.Fuzz -c Release -p:TargetFrameworks=net10.0 -v quiet
          timeout 120 fuzz/ConfigFerret.Fuzz/bin/Release/net10.0/ConfigFerret.Fuzz "$TARGET" "fuzz/findings/$TARGET" ||
            echo "The replay exited with code $? (124 means it was stopped after 120 seconds)."
