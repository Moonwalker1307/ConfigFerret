name: Desktop release

# Releases the desktop app on GitHub Releases only, never on nuget.org. Tags are `desktop-vX.Y.Z`, which do not match
# the `v*` filter that ci.yml uses to publish the NuGet packages.
on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'src/ConfigFerret.Desktop/**'
      - 'src/ConfigFerret/**'
      - 'src/ConfigFerret.GitHub/**'
      - 'src/ConfigFerret.Octopus/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: desktop-release-${{ github.ref }}
  # A tag must never release twice, and a release must not be cancelled half way. Only pull request runs are replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Pick the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not desktop-vX.Y.Z or desktop-vX.Y.Z-pre."
              exit 1
            fi
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.rid }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests build linux-x64 only, as a smoke test. Tags and manual runs build every platform.
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"rid":"linux-x64","os":"ubuntu-latest"}]') || fromJSON('[{"rid":"win-x64","os":"windows-latest"},{"rid":"win-arm64","os":"windows-latest"},{"rid":"osx-x64","os":"macos-latest"},{"rid":"osx-arm64","os":"macos-latest"},{"rid":"linux-x64","os":"ubuntu-latest"},{"rid":"linux-arm64","os":"ubuntu-latest"}]') }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app runs on .NET 10, but the libraries it references also target net11.0, so restoring them needs both SDKs.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # The app is not packable. This catches a change that would make `dotnet pack` produce a package for nuget.org.
      - name: Check the app produces no NuGet package
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          dotnet pack src/ConfigFerret.Desktop -o packcheck -p:TargetFrameworks=net10.0
          if [[ -d packcheck ]] && [[ -n "$(find packcheck -name '*.nupkg' -print -quit)" ]]; then
            echo "::error::ConfigFerret.Desktop produced a .nupkg. It must keep IsPackable=false."
            find packcheck -name '*.nupkg'
            exit 1
          fi

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/ConfigFerret.Desktop -c Release -r "$RID" --self-contained true \
            -f net10.0 -p:Version="$VERSION" \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none \
            -o "out/$RID"

      - name: Package (Windows)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "out/$env:RID/*" -DestinationPath "dist/ConfigFerret-$env:VERSION-$env:RID.zip"

      - name: Package (Linux)
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          name="ConfigFerret-$VERSION-$RID"
          mkdir -p "dist" "stage/$name"
          cp -a "out/$RID/." "stage/$name/"
          cp assets/icon.png "stage/$name/icon.png"
          chmod +x "stage/$name/ConfigFerret.Desktop"
          cat > "stage/$name/ConfigFerret.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=ConfigFerret
          Comment=See where every configuration value comes from
          Exec=ConfigFerret.Desktop
          Icon=icon
          Terminal=false
          Categories=Development;
          DESKTOP
          tar -C stage -czf "dist/$name.tar.gz" "$name"

      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          numeric="${VERSION%%-*}"
          app="stage/ConfigFerret.app"
          mkdir -p dist "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -a "out/$RID/." "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/ConfigFerret.Desktop"

          iconset="$RUNNER_TEMP/ConfigFerret.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            sips -z "$((size * 2))" "$((size * 2))" assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/ConfigFerret.icns"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ConfigFerret.Desktop</string>
            <key>CFBundleIdentifier</key><string>io.github.moonwalker1307.configferret</string>
            <key>CFBundleName</key><string>ConfigFerret</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$numeric</string>
            <key>CFBundleVersion</key><string>$numeric</string>
            <key>CFBundleIconFile</key><string>ConfigFerret</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"

          # Ad-hoc signature only. The app is not notarized.
          (cd stage && codesign --force --deep -s - ConfigFerret.app)
          ditto -c -k --keepParent "$app" "dist/ConfigFerret-$VERSION-$RID.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release

      - name: Write checksums and release notes
        shell: bash
        run: |
          (cd release && sha256sum ConfigFerret-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          Desktop app builds for Windows, macOS and Linux (x64 and arm64). Check downloads against `SHA256SUMS.txt`.

          The builds are not signed or notarized, so your system warns before the first start:

          - **macOS:** unzip, then right-click `ConfigFerret.app` and choose Open. Or run `xattr -dr com.apple.quarantine ConfigFerret.app`.
          - **Windows:** if SmartScreen blocks it, choose More info, then Run anyway.
          - **Linux:** extract the archive and run `./ConfigFerret.Desktop`.

          The ConfigFerret libraries and the `configferret` tool are released separately on NuGet.
          NOTES

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          args=()
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          # --latest=false keeps the "latest release" badge on the library releases.
          gh release create "$TAG" release/* \
            --title "ConfigFerret Desktop $VERSION" \
            --notes-file notes.md \
            --verify-tag \
            --latest=false \
            "${args[@]}"
