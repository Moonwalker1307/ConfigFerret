name: Security

on:
  schedule:
    # Nightly at 03:17 UTC.
    - cron: '17 3 * * *'
  workflow_dispatch:
  # Also run on pull requests that change this workflow or package references, so changes are checked before they merge.
  pull_request:
    paths:
      - '.github/workflows/security.yml'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  nuget-audit:
    name: NuGet vulnerable and deprecated packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - run: dotnet restore

      - name: Vulnerable packages (fails the job)
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          dotnet list package --vulnerable --include-transitive --format json > vulnerable.json
          count=$(jq '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?)] | length' vulnerable.json)
          {
            echo "## Vulnerable NuGet packages"
            echo
            echo '```'
            cat vulnerable.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::error::Found $count vulnerable NuGet package(s). See the job summary."
            exit 1
          fi

      - name: Deprecated packages (warns only)
        shell: bash
        run: |
          dotnet list package --deprecated --include-transitive | tee deprecated.txt
          dotnet list package --deprecated --include-transitive --format json > deprecated.json
          count=$(jq '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?)] | length' deprecated.json)
          {
            echo "## Deprecated NuGet packages"
            echo
            echo '```'
            cat deprecated.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::warning::Found $count deprecated NuGet package(s). See the job summary."
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: nuget-audit
          path: |
            vulnerable.*
            deprecated.*

  codeql:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - run: dotnet build -c Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
          output: sarif-results

      - name: Summarize CodeQL results
        if: always()
        shell: bash
        run: |
          {
            echo "## CodeQL results"
            echo
            jq -r '.runs[].results[] | "- `\(.ruleId)` (\(.level // "warning")) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine): \(.message.text | split("\n")[0])"' sarif-results/*.sarif
            echo
            echo "Total: $(jq '[.runs[].results[]] | length' sarif-results/*.sarif)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Keep the raw results as an artifact so they can be read without access to the Security tab.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results
