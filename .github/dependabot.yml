version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft-extensions:
        patterns:
          - 'Microsoft.Extensions.*'
      xunit:
        patterns:
          - 'xunit*'
    ignore:
      # Each target framework pins its own Microsoft.Extensions major (10.x for net10.0, 11.x for net11.0).
      # A major bump would move net10.0 onto 11.x, so take only minor and patch updates.
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
