apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: TOKEN
              valueFrom: { secretKeyRef: { name: synced, key: token } }
          envFrom:
            - secretRef: { name: from-all }
          volumeMounts:
            - { name: kv, mountPath: /mnt/kv }
            - { name: aws, mountPath: /mnt/aws }
            - { name: gcp, mountPath: /mnt/gcp/db.txt, subPath: db.txt }
      volumes:
        - name: kv
          csi: { driver: secrets-store.csi.k8s.io, volumeAttributes: { secretProviderClass: azure-kv } }
        - name: aws
          csi: { driver: secrets-store.csi.k8s.io, volumeAttributes: { secretProviderClass: aws } }
        - name: gcp
          csi: { driver: secrets-store.csi.k8s.io, volumeAttributes: { secretProviderClass: gcp } }
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: azure-kv }
spec:
  provider: azure
  parameters:
    keyvaultName: contoso
    objects: |
      array:
        - |
          objectName: token
          objectType: secret
          objectVersion: abc
        - |
          objectName: tls
          objectAlias: tls.pem
  secretObjects:
    - secretName: synced
      data:
        - { objectName: token, key: token }
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: aws }
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "prod/db"
        objectType: secretsmanager
        jmesPath:
          - { path: username, objectAlias: db-user }
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: gcp }
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/p/secrets/db/versions/latest"
        fileName: "db.txt"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: all }
spec:
  secretStoreRef: { name: store, kind: ClusterSecretStore }
  target: { name: from-all, template: { type: Opaque } }
  dataFrom:
    - extract: { key: app }
    - find: { name: { regexp: "^x" } }
  data:
    - secretKey: k
      sourceRef: { storeRef: { name: store2 } }
      remoteRef: { key: r, property: p, version: "1" }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: store }
spec: { provider: { vault: { server: "https://vault" } } }
