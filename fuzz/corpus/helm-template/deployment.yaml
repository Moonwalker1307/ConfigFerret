apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  template:
    spec:
      containers:
        - name: api
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: CFT_Db__Host
              value: {{ .Values.db.host | quote }}
